[project]
name = "griot-api"
version = "0.1.0"
description = "Griot API: ingest, search, bridges, export"
requires-python = ">=3.12"
dependencies = [
  "griot-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griot_api"]
