[project]
name = "griot-analyzer"
version = "0.1.0"
description = "Local-first full-song analyzer: features leave the machine, audio never does"
requires-python = ">=3.12"
dependencies = [
  "griot-core",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "mutagen>=1.47",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy models; installed separately because they are large and platform-sensitive.
ml = [
  "torch>=2.3",
  "librosa>=0.10",
  "soundfile>=0.12",
  "essentia>=2.1b6.dev1110",
  "muq>=0.1",
  "transformers>=4.45,<4.50",  # MuQ breaks on transformers 5.x
  "all-in-one-mlx>=1.0; sys_platform == 'darwin'",
  "all-in-one-infer>=0.1; sys_platform == 'linux'",
]

[project.scripts]
griot = "griot_analyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griot_analyzer"]
