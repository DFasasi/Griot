[project]
name = "griot-pipelines"
version = "0.1.0"
description = "Catalog enrichment: popularity, Deezer metadata/previews, LRCLIB lyrics -> embeddings + themes"
requires-python = ">=3.12"
dependencies = [
  "griot-core",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.26",
]

[project.optional-dependencies]
lyrics = ["sentence-transformers>=3.3", "transformers>=4.45,<4.50", "anthropic>=0.70"]

[project.scripts]
griot-enrich = "griot_pipelines.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griot_pipelines"]
