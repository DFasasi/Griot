services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: griot
      POSTGRES_PASSWORD: griot
      POSTGRES_DB: griot
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U griot"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
