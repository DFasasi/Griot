name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: griot, POSTGRES_PASSWORD: griot, POSTGRES_DB: griot }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U griot" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages  # core deps only; ML extras are not needed for tests
      - run: uv run ruff check . && uv run ruff format --check .
      - run: for f in db/migrations/*.sql; do PGPASSWORD=griot psql -v ON_ERROR_STOP=1 -h localhost -U griot -d griot -f "$f"; done
      - run: uv run pytest -q
        env:
          GRIOT_TEXT_STEERING: "0"
          GRIOT_TEST_DATABASE_URL: postgresql://griot:griot@localhost:5432/griot

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci && npx tsc --noEmit && npm run lint

  desktop:
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
