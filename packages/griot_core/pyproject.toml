[project]
name = "griot-core"
version = "0.1.0"
description = "Griot shared core: feature schema, music theory, transition cost, bridge pathfinder"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/griot_core"]
