[project]
name = "griot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["griot-core", "griot-analyzer", "griot-api", "griot-pipelines"]

[tool.uv.workspace]
members = ["packages/griot_core", "apps/analyzer", "apps/api", "pipelines"]

[tool.uv.sources]
griot-core = { workspace = true }
griot-analyzer = { workspace = true }
griot-api = { workspace = true }
griot-pipelines = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # pairwise zip(x, x[1:]) is intentionally unequal-length

[tool.pytest.ini_options]
testpaths = ["packages/griot_core/tests", "apps/analyzer/tests", "apps/api/tests", "pipelines/tests"]

[tool.ruff.lint.isort]
known-first-party = ["griot_core", "griot_analyzer", "griot_api", "griot_pipelines"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends", "fastapi.Query", "fastapi.Header"]
